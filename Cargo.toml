[package]
name = "shdeps"
# Cargo requires SemVer here and prints it during `cargo build`, but shdeps'
# public version is generated by build.rs as YYYYMMDD-HHMMSS-<8hex>. Keep this
# placeholder from leaking into release assets or `shdeps version`.
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Standalone dependency manager for shell-oriented development environments"
build = "build.rs"

[lib]
name = "shdeps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
bzip2 = "0.5.2"
zstd = { version = "0.13.3", default-features = false }
xz2 = "0.1.7"

[[bin]]
name = "shdeps"
path = "src/main.rs"
