[package]
name = "shdeps"
# Cargo requires SemVer here and prints it during local builds. The public
# `shdeps version` identity still comes from build.rs so release artifacts stay
# timestamp/hash traceable, but the package version should look intentional in
# Cargo output instead of leaking a placeholder.
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Standalone dependency manager for shell-oriented development environments"
build = "build.rs"

[lib]
name = "shdeps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
bzip2 = "0.5.2"
zstd = { version = "0.13.3", default-features = false }
xz2 = "0.1.7"

# Used only on Unix targets for syscall bindings and POSIX constants
# (`flock`, `setsid`, `kill`, `getppid`, `LOCK_EX`, `SIGKILL`, `EPERM`,
# `SIGTERM`, etc.). The crate is pure FFI bindings — it does not add a
# runtime dependency and stays fully compatible with the
# `x86_64-unknown-linux-musl` static-binary distribution target. The
# crate is intentionally Unix-only here; nothing in shdeps's Windows
# code path needs libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "shdeps"
path = "src/main.rs"

# Treat compiler warnings as build errors. shdeps's CI runs `cargo
# clippy -- -D warnings` for the lint pass, but local `cargo build` /
# `cargo test` used to silently produce warnings (unused imports,
# dead code from `#[cfg(test)]`-gated helpers, etc.) that masked
# real regressions. Promoting warnings to errors here makes those
# regressions visible at edit time rather than at CI time. Granular
# overrides (e.g., `#[allow(dead_code)]` on a specific item) still
# work, so this is not a sweeping no-warnings policy — it just
# refuses silently-broken builds.
[lints.rust]
warnings = "deny"
