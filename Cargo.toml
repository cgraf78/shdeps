[package]
name = "shdeps"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Standalone dependency manager for shell-oriented development environments"
build = "build.rs"

[lib]
name = "shdeps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4.2", default-features = false, features = [
    "deflate-flate2",
    "flate2",
] }
bzip2 = "0.5.2"
zstd = { version = "0.13.3", default-features = false }

[[bin]]
name = "shdeps"
path = "src/main.rs"
