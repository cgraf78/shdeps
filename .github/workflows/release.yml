name: Release

on:
  push:
    tags:
      # GitHub's filter glob is intentionally coarse here; scripts/release-tag.sh
      # performs the exact YYYYMMDD-HHMMSS-<8hex> validation against the commit.
      - "20*"

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
    with:
      # shdeps' public version is generated from build time plus the commit
      # suffix, not from Cargo.toml semver. Ask the shared workflow to validate
      # the exact release tag instead of forcing this repo through Cargo's
      # semver-oriented `version-command` + `tag-prefix` path.
      tag-command: scripts/release-tag.sh
      setup-command: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # shdeps links native compression crates into static Linux release
          # binaries. The reusable workflow owns the matrix, but this repo
          # owns the linker/toolchain prerequisite those musl targets need.
          sudo apt-get update
          sudo apt-get install -y musl-tools
        fi
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
