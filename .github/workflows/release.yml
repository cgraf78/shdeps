name: Release

on:
  push:
    tags:
      # GitHub's filter glob is intentionally coarse here; scripts/release-tag.sh
      # performs the exact YYYYMMDD-HHMMSS-<8hex> validation against the commit.
      - "20*"

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@a2dd8390ddd0b410d5a82822296036387247cc4c
    permissions:
      contents: write
    with:
      android-aarch64: true
      android-x86_64: true
      # shdeps' public version is generated from the UTC committer timestamp
      # plus the commit suffix, not from Cargo.toml semver. Ask the shared
      # workflow to validate the exact release tag instead of forcing this repo
      # through Cargo's semver-oriented `version-command` + `tag-prefix` path.
      tag-command: scripts/release-tag.sh
      # shdeps links native compression crates into static Linux release
      # binaries, so musl targets need a musl linker. The shared workflow owns
      # the matrix and now owns that matrix's linker prerequisite too.
      install-musl-tools: true
      setup-command: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          # macOS workflow steps still run under Apple's /bin/bash 3.2, while
          # the shipped sourceable wrapper requires Bash 4.3+. Install
          # Homebrew Bash for the release smoke test without changing the
          # workflow shell itself.
          brew list bash >/dev/null 2>&1 || brew install bash
        fi
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
