name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
    with:
      version-command: scripts/release-tag.sh
      # shdeps deliberately keeps runtime versions commit-based, while release
      # archives use the full distribution tag (`v1.2.3`) in their filenames.
      # The shared workflow normally prepends `v` to semver output from Cargo;
      # disable that prefix here so a real tag validates as `v1.2.3` instead of
      # the impossible `vv1.2.3`.
      tag-prefix: ""
      setup-command: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # shdeps links native compression crates into static Linux release
          # binaries. The reusable workflow owns the matrix, but this repo
          # owns the linker/toolchain prerequisite those musl targets need.
          sudo apt-get update
          sudo apt-get install -y musl-tools
        fi
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
