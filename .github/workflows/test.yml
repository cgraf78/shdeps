name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    name: Rust
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Linux release target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Smoke release archive packaging
        run: |
          # Release archives are the fleet bootstrap contract, so regular CI
          # should exercise the same Linux musl label that tagged releases
          # publish instead of waiting until a tag push discovers drift.
          scripts/package-release.sh x86_64-unknown-linux-musl linux-x86_64-musl
          scripts/smoke-release.sh linux-x86_64-musl

      - name: Run shell parity against Rust binary
        run: SHDEPS_IMPL=rust SHDEPS_RUST_CLI=target/release/shdeps ./test/shdeps-test

      - name: Smoke Rust compatibility wrapper
        run: SHDEPS_RUST_CLI=target/release/shdeps ./test/shdeps-wrapper-test

      - name: Check Rust docs
        run: RUSTDOCFLAGS='-D missing-docs' cargo doc --locked --no-deps

  install-bash32:
    runs-on: macos-15-intel
    name: install.sh Bash 3.2
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Smoke test release installer with stock macOS Bash
        shell: /bin/bash {0}
        run: |
          /bin/bash --version
          /bin/bash scripts/smoke-install-bash32.sh

  test:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      profiles: base,shellcheck
      test-command: ./test/shdeps-test
