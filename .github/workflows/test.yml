name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@5bf6211ec3c3365f0310dd0aa22a6bd282554db5
    with:
      clippy-command: cargo clippy --locked --all-targets -- -D warnings
      doc-command: RUSTDOCFLAGS='-D missing-docs' cargo doc --locked --no-deps
      termux-command: scripts/termux-ci.sh
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      package-smoke-setup-command: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # The release archive smoke test intentionally exercises the same
          # static Linux target that fleet bootstrap installs. Keep this as
          # caller-owned setup because the shared Rust workflow should not need
          # to know which projects package musl archives.
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
        fi
      package-smoke-command: |
        # Release archives are the fleet bootstrap contract, so regular CI
        # should exercise the same Linux musl label that tagged releases
        # publish instead of waiting until a tag push discovers drift.
        scripts/package-release.sh x86_64-unknown-linux-musl linux-x86_64-musl
        scripts/smoke-release.sh linux-x86_64-musl

        # The sourceable wrapper needs the optimized host binary from rust-ci's
        # build gate. Installer/release shell suites run in the shell job below.
        SHDEPS_RUST_CLI=target/release/shdeps tests/shell/shdeps-wrapper-test

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@5bf6211ec3c3365f0310dd0aa22a6bd282554db5
    with:
      profiles: base,shellcheck
      # Shell-owned behavior lives under tests/shell. Cargo integration tests
      # stay in the conventional tests/*.rs location.
      test-command: >
        tests/shell/install-sh-test &&
        tests/shell/completion-test &&
        tests/shell/installer-flow-test &&
        tests/shell/lua-api-test &&
        tests/shell/lua-bootstrap-test &&
        tests/shell/release-scripts-test

  bash32:
    uses: cgraf78/actions/.github/workflows/bash32-ci.yml@5bf6211ec3c3365f0310dd0aa22a6bd282554db5
    with:
      command: /bin/bash scripts/smoke-install-bash32.sh
