name: Tests

on:
  push:
    # main is the only maintained branch. Keeping the retired master name here
    # would make the trigger disagree with branch protection and release docs.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@55c1b529b59515fc1d23ad9cac7222f0d2f21317
    with:
      # rust-version is a compatibility promise, so exercise it inside the
      # shared required gate instead of leaving the README badge aspirational.
      # The shared defaults own Clippy's locked all-target/all-feature scope and
      # rustdoc's locked missing-doc lint; local copies would add a drift site.
      msrv-toolchain: "1.85"
      termux-command: scripts/termux-ci.sh
      # shdeps is installed from release archives on real machines. Build and
      # unpack that exact archive on the host before transporting its binary
      # into Termux so CI covers packaging/layout drift as well as Bionic ABI.
      termux-host-command: |
        archive=$(
          CARGO_TARGET_DIR="$RUNNER_TEMP/shdeps-termux-target" \
            scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        )
        scripts/smoke-release.sh "$ASSET_PLATFORM"
        mkdir -p .termux-ci
        tar -xzf "$archive" -C .termux-ci ./shdeps
      android-package-smoke-command: |
        # AArch64 is the dominant physical-device artifact; the x86_64 archive
        # gets the independent emulator runtime proof above. Both remain
        # published because shdeps selects an artifact by device architecture.
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      # The release archive smoke test intentionally exercises the same static
      # Linux target that fleet bootstrap installs. zstd-sys compiles native
      # code, so shdeps needs the optional host musl linker that pure-Rust
      # sibling repositories deliberately skip.
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-install-musl-tools: true
      package-smoke-command: |
        # Release archives are the fleet bootstrap contract, so regular CI
        # should exercise the same Linux musl label that tagged releases
        # publish instead of waiting until a tag push discovers drift.
        scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl
        scripts/smoke-release.sh linux-x86_64-musl

        # The sourceable wrapper needs the optimized host binary from rust-ci's
        # build gate. Installer/release shell suites run in the shell job below.
        SHDEPS_RUST_CLI=target/release/shdeps tests/shell/shdeps-wrapper-test

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@55c1b529b59515fc1d23ad9cac7222f0d2f21317
    with:
      # Cross-distribution package-manager behavior is shdeps' product surface,
      # so the broad shell matrix is intentional rather than shared-CI drift.
      matrix-set: full
      profiles: base
      shellcheck-inventory-path: .github/shellcheck-files.txt
      # Shell-owned behavior lives under tests/shell. Cargo integration tests
      # stay in the conventional tests/*.rs location.
      test-command: >
        tests/shell/helpers-test &&
        tests/shell/install-sh-test &&
        tests/shell/install-interruption-test &&
        tests/shell/completion-test &&
        tests/shell/examples-test &&
        tests/shell/installer-flow-test &&
        tests/shell/lua-api-test &&
        tests/shell/lua-bootstrap-test &&
        tests/shell/release-scripts-test

  bash32:
    uses: cgraf78/actions/.github/workflows/bash32-ci.yml@55c1b529b59515fc1d23ad9cac7222f0d2f21317
    with:
      # install.sh runs before shdeps can provide a newer shell, including on
      # stock macOS. This compatibility gate is therefore product behavior,
      # while the sourceable API itself intentionally requires Bash 4.3+.
      command: /bin/bash scripts/smoke-install-bash32.sh

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This
      # gate verifies every unavoidable action literal and all vendored release
      # scripts still match that single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@55c1b529b59515fc1d23ad9cac7222f0d2f21317
