name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      clippy-command: cargo clippy --locked --all-targets -- -D warnings
      doc-command: RUSTDOCFLAGS='-D missing-docs' cargo doc --locked --no-deps
      package-smoke-setup-command: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # The release archive smoke test intentionally exercises the same
          # static Linux target that fleet bootstrap installs. Keep this as
          # caller-owned setup because the shared Rust workflow should not need
          # to know which projects package musl archives.
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
        fi
      package-smoke-command: |
        # Release archives are the fleet bootstrap contract, so regular CI
        # should exercise the same Linux musl label that tagged releases
        # publish instead of waiting until a tag push discovers drift.
        scripts/package-release.sh x86_64-unknown-linux-musl linux-x86_64-musl
        scripts/smoke-release.sh linux-x86_64-musl

        # The shell parity and wrapper checks use the optimized host binary from
        # rust-ci's build gate. That keeps Rust behavior covered against the
        # existing Bash suite without making every platform matrix job compile a
        # release binary just to run wrapper smoke tests.
        SHDEPS_IMPL=rust SHDEPS_RUST_CLI=target/release/shdeps ./test/shdeps-test
        SHDEPS_RUST_CLI=target/release/shdeps ./test/shdeps-wrapper-test

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      profiles: base,shellcheck
      test-command: ./test/shdeps-test

  bash32:
    uses: cgraf78/actions/.github/workflows/bash32-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      command: /bin/bash scripts/smoke-install-bash32.sh
