# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed by release-lib.sh after sourcing
#
# Per-project inputs to the shared release scripts vendored from
# cgraf78/actions. Everything else about the release flow lives in
# scripts/release-lib.sh and must not be forked here.

RELEASE_ENV_PREFIX=SHDEPS
RELEASE_SLUG=shdeps
RELEASE_ASSET_NAME=shdeps
RELEASE_BINARY=shdeps

# `shdeps.sh` is the Rust-era sourceable wrapper. Release archives ship that
# single public wrapper path so source checkouts and packaged installs expose
# the same Bash API surface. `install.sh` ships so an extracted archive can
# activate itself without a source checkout.
RELEASE_PAYLOAD_FILES=(
  shdeps.sh
  install.sh
  README.md
  LICENSE
  man/man1/shdeps.1
  completions/shdeps.bash
  completions/shdeps.zsh
  completions/shdeps.fish
  lua/shdeps.lua
  lua/shdeps/core.lua
  lua/shdeps/bootstrap.lua
)
